name: knalpot-prod

# Produksi. Perbedaan pokok dari compose.yaml (dev):
#   - tidak ada bind mount source; semuanya dari image
#   - MySQL TIDAK dipublikasikan ke internet, hanya jaringan internal Docker
#   - port web bisa diatur lewat WEB_PORT agar tidak bentrok dengan situs lain
#     yang sudah jalan di VPS; TLS ditangani reverse proxy di host
#
#   docker compose -f compose.prod.yaml up -d --build

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: runtime
    image: knalpot-app-prod
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage:/var/www/html/storage
      - uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: web
    image: knalpot-web-prod
    restart: unless-stopped
    ports:
      # Hanya di-bind ke localhost: reverse proxy host yang menghadap internet.
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    volumes:
      - uploads:/var/www/html/public/uploads:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    # Sengaja tanpa `ports`: database tidak boleh terjangkau dari luar VPS.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  dbdata:
  storage:
  uploads:
