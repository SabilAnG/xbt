# Toko partner: *.shop.garagehs-speed.com
#
# Satu vhost melayani semua partner. Aplikasi yang mengenali siapa yang dituju,
# dari Host header — nginx hanya meneruskan.
#
# Wildcard di bawah `shop.` dipilih, bukan `*.garagehs-speed.com`, karena domain
# induknya ada di server lain (Hostinger) berikut email dan subdomainnya.
# Wildcard di sana akan menangkap subdomain milik mereka yang belum punya record
# sendiri — termasuk yang dipakai webmail.
#
# Pasang:
#   scp deploy/nginx-partner.conf root@147.93.81.184:/etc/nginx/sites-available/knalpot-partner
#   ssh root@147.93.81.184 'ln -sf /etc/nginx/sites-available/knalpot-partner /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx'

server {
    listen 80;
    listen [::]:80;

    # Hanya subdomain di bawah shop. Alamat shop itu sendiri punya vhost sendiri
    # dan tidak boleh tertangkap di sini.
    server_name ~^(?<partner>[a-z0-9][a-z0-9-]*)\.shop\.garagehs-speed\.com$;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64M;
    }
}
