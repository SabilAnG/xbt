# Vhost host-level untuk shop.garagehs-speed.com
#
# Dipasang di /etc/nginx/sites-available/shop.garagehs-speed.com lalu di-symlink
# ke sites-enabled. Blok TLS ditambahkan otomatis oleh certbot --nginx; berkas
# ini sengaja hanya berisi HTTP agar penerbitan sertifikat bisa jalan dulu.
#
# Container hanya mendengar di 127.0.0.1:8090, jadi satu-satunya jalan masuk
# dari internet adalah lewat vhost ini.

server {
    listen 80;
    listen [::]:80;

    server_name shop.garagehs-speed.com;

    # Ukuran unggah harus selaras dengan client_max_body_size di container
    # dan upload_max_filesize di php.prod.ini, kalau tidak upload gambar
    # produk akan ditolak di lapisan terluar tanpa pesan yang jelas.
    client_max_body_size 64M;

    access_log /var/log/nginx/shop.garagehs-speed.com.access.log;
    error_log  /var/log/nginx/shop.garagehs-speed.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Livewire menunggu balasan agak lama saat menyimpan nota besar.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_buffering off;
    }
}
