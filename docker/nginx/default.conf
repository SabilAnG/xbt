# Browsers that advertise WebP get the .webp sibling produced by
# docker/php/make-webp.php (header1.png -> header1.png.webp). The HTML keeps
# pointing at the original file, so the markup stays identical to the live site
# while the hero images drop from ~33 MB to ~2 MB.
map $http_accept $webp_suffix {
    default        "";
    "~*image/webp" ".webp";
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;
    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Match what the live site serves through Cloudflare: gzip on text assets and
    # a 30 day cache on static files. Without these the 32 MB hero slider is
    # re-fetched on every slide transition, which is what makes it stutter.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Photos: hand back the .webp sibling when the browser accepts it.
    location ~* \.(?:png|jpe?g)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header Vary "Accept";
        access_log off;
        try_files $uri$webp_suffix $uri @laravel;
    }

    location ~* \.(?:gif|webp|svg|ico|css|js|woff2?|ttf|otf|eot|mp4|webm)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri @laravel;
    }

    # Not every URL ending in .js/.css is a file on disk: Livewire serves
    # /livewire/livewire.js from a route. Anything the static rules cannot find
    # has to fall through to PHP instead of 404-ing, or the admin panel loses
    # its JavaScript entirely and every form stops responding.
    location @laravel {
        rewrite ^ /index.php last;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
