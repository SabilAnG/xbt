# Konfigurasi nginx produksi.
#
# Container ini hanya melayani HTTP di dalam jaringan Docker. TLS dan domain
# ditangani reverse proxy di host, yang meneruskan ke port yang dipetakan
# compose.prod.yaml. Jadi tidak ada listen 443 di sini.

map $http_accept $webp_suffix {
    default        "";
    "~*image/webp" ".webp";
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;
    client_max_body_size 64M;

    # Header keamanan dasar. HSTS sengaja diserahkan ke proxy yang memegang TLS.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Alamat asli pengunjung datang dari proxy.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(?:png|jpe?g)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Vary "Accept";
        access_log off;
        try_files $uri$webp_suffix $uri @laravel;
    }

    location ~* \.(?:gif|webp|svg|ico|css|js|woff2?|ttf|otf|eot|mp4|webm)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri @laravel;
    }

    # Tidak semua URL berakhiran .js/.css adalah file di disk — Livewire
    # menyajikan asetnya lewat route. Yang tidak ketemu harus jatuh ke PHP,
    # bukan 404, atau panel admin kehilangan JavaScript-nya.
    location @laravel {
        rewrite ^ /index.php last;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Jangan pernah layani berkas tersembunyi maupun .env.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
