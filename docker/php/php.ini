memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300

; Filament file uploads / large form posts
max_input_vars = 5000

date.timezone = Asia/Jakarta

; ---------------------------------------------------------------- opcache
;
; Kode ada di bind mount Windows, dan mount itu terukur ~125 berkas/detik
; sementara filesystem di dalam VM ~16.000/detik. Jadi setiap perjalanan PHP
; ke disk mahal, dan setelan bawaan membuatnya berkali-kali lipat lebih sering
; daripada yang perlu.

opcache.enable = 1
opcache.enable_cli = 0

; Bawaannya 10.000, sedangkan vendor/ saja berisi 17.016 berkas PHP. Akibatnya
; opcache penuh lalu membuang isinya terus-menerus dan membaca ulang lewat
; mount yang lambat tadi.
opcache.max_accelerated_files = 30000
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32

; PERHATIAN — ini menukar kenyamanan dengan kecepatan.
;
; Dengan 0, PHP berhenti mengecek tanggal ubah tiap berkas pada tiap request.
; Itu bagian termahal di bind mount, tapi artinya perubahan kode PHP TIDAK
; terlihat sampai container di-restart:
;
;     docker compose restart app
;
; Kembalikan ke 1 bila ingin kembali ke alur edit-lalu-refresh.
opcache.validate_timestamps = 0

; Tiap resolusi path juga perjalanan ke mount, jadi simpan lebih lama.
realpath_cache_ttl = 600
